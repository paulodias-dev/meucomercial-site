name: Site / Portal quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript, contratos e build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run lint
      - name: Validate portal, commercial journeys and radio contracts
        run: |
          npm run test:radio
          npm run test:journeys
          npm run test:portal
      - name: Compile Vite and Express
        run: npm run build
      - name: Exercise compiled production server over HTTP/TLS
        run: npm run test:http
      - name: Install pinned Playwright Chromium for browser E2E
        run: |
          npm install --no-save --no-package-lock playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Verify mobile TV, forms, SEO and radio in Chromium
        run: npm run test:browser
